[project]
name = "dsh-core-worker"
version = "0.4.0"
description = "FPL shared model and agent execution runtime"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=25.1,<26", "httpx>=0.28,<0.29", "pydantic>=2.10,<3", "websockets>=15,<16", "pillow>=12,<13", "pyyaml>=6,<7", "jsonschema>=4.25,<5", "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "cryptography>=45,<47", "python-multipart>=0.0.20,<1", "sqlalchemy[asyncio]>=2.0.40,<3", "aiosqlite>=0.21,<1", "mcp>=2.0,<3", "httpx2>=2,<3"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsh_core_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["dsh_core_worker/extracted"]

[project.scripts]
fpl-core = "dsh_core_worker.cli:main"
